openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
  - name: meetings
  - name: action-items
  - name: search
  - name: assistant
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get meeting intelligence overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /meetings:
    get:
      operationId: listMeetings
      tags: [meetings]
      summary: List meetings
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [all, completed, processing, failed]
            default: all
      responses:
        "200":
          description: Meetings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meeting"
    post:
      operationId: createMeeting
      tags: [meetings]
      summary: Create a meeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingInput"
      responses:
        "201":
          description: Created meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
  /meetings/{id}:
    get:
      operationId: getMeeting
      tags: [meetings]
      summary: Get a meeting with transcript and analysis
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "200":
          description: Meeting detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingDetail"
        "404":
          description: Meeting not found
    delete:
      operationId: deleteMeeting
      tags: [meetings]
      summary: Delete a meeting
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "204":
          description: Deleted
  /meetings/{id}/process:
    post:
      operationId: processMeeting
      tags: [meetings]
      summary: Process meeting audio or demo data
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessMeetingInput"
      responses:
        "202":
          description: Processing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
  /action-items:
    get:
      operationId: listActionItems
      tags: [action-items]
      summary: List action items
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending, completed, overdue]
            default: all
      responses:
        "200":
          description: Action items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActionItem"
  /action-items/{id}:
    patch:
      operationId: updateActionItem
      tags: [action-items]
      summary: Update an action item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionItemUpdate"
      responses:
        "200":
          description: Updated action item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionItem"
  /search:
    post:
      operationId: searchMeetings
      tags: [search]
      summary: Search meeting knowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchInput"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
  /ask:
    post:
      operationId: askMeetings
      tags: [assistant]
      summary: Ask a grounded question about meetings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: Grounded answer with sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponse"
components:
  parameters:
    MeetingId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Meeting:
      type: object
      required: [id, title, meetingType, clientName, date, duration, participants, status, actionItemCount, decisionCount]
      properties:
        id: { type: string }
        title: { type: string }
        meetingType: { type: string }
        clientName: { type: string }
        date: { type: string }
        duration: { type: string }
        participants:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [completed, processing, failed, uploading]
        actionItemCount: { type: integer }
        decisionCount: { type: integer }
        summary: { type: ["string", "null"] }
    MeetingInput:
      type: object
      required: [title, meetingType, clientName, date, participants]
      properties:
        title: { type: string, minLength: 1 }
        meetingType: { type: string }
        clientName: { type: string }
        date: { type: string }
        participants:
          type: array
          minItems: 1
          items: { type: string }
        description: { type: string }
    ProcessMeetingInput:
      type: object
      properties:
        demo: { type: boolean, default: true }
    TranscriptSegment:
      type: object
      required: [id, speaker, timestamp, text]
      properties:
        id: { type: string }
        speaker: { type: string }
        timestamp: { type: string }
        seconds: { type: number }
        text: { type: string }
    Decision:
      type: object
      required: [id, text, timestamp]
      properties:
        id: { type: string }
        text: { type: string }
        timestamp: { type: string }
    ActionItem:
      type: object
      required: [id, meetingId, meetingTitle, title, owner, deadline, priority, status, confidence]
      properties:
        id: { type: string }
        meetingId: { type: string }
        meetingTitle: { type: string }
        title: { type: string }
        description: { type: string }
        owner: { type: string }
        deadline: { type: string }
        priority:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        status:
          type: string
          enum: [pending, completed]
        confidence: { type: number }
    ActionItemUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, completed]
        owner: { type: string }
        deadline: { type: string }
        priority:
          type: string
          enum: [HIGH, MEDIUM, LOW]
    MeetingDetail:
      allOf:
        - $ref: "#/components/schemas/Meeting"
        - type: object
          required: [transcript, decisions, topics, risks, openQuestions]
          properties:
            transcript:
              type: array
              items: { $ref: "#/components/schemas/TranscriptSegment" }
            decisions:
              type: array
              items: { $ref: "#/components/schemas/Decision" }
            topics:
              type: array
              items: { type: string }
            risks:
              type: array
              items: { type: string }
            openQuestions:
              type: array
              items: { type: string }
    Dashboard:
      type: object
      required: [totalMeetings, actionItems, pendingItems, completedItems, activity, recentMeetings, upcomingDeadlines, recentDecisions]
      properties:
        totalMeetings: { type: integer }
        actionItems: { type: integer }
        pendingItems: { type: integer }
        completedItems: { type: integer }
        activity:
          type: array
          items:
            type: object
            required: [label, meetings]
            properties:
              label: { type: string }
              meetings: { type: integer }
        recentMeetings:
          type: array
          items: { $ref: "#/components/schemas/Meeting" }
        upcomingDeadlines:
          type: array
          items: { $ref: "#/components/schemas/ActionItem" }
        recentDecisions:
          type: array
          items: { $ref: "#/components/schemas/Decision" }
    SearchInput:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1 }
        mode:
          type: string
          enum: [keyword, semantic]
          default: semantic
    SearchResult:
      type: object
      required: [meetingId, meetingTitle, timestamp, speaker, snippet, score]
      properties:
        meetingId: { type: string }
        meetingTitle: { type: string }
        timestamp: { type: string }
        speaker: { type: string }
        snippet: { type: string }
        score: { type: number }
    AskInput:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1 }
    AskSource:
      type: object
      required: [meetingId, meetingTitle, timestamp, quote]
      properties:
        meetingId: { type: string }
        meetingTitle: { type: string }
        timestamp: { type: string }
        quote: { type: string }
    AskResponse:
      type: object
      required: [answer, sources, conversationId]
      properties:
        answer: { type: string }
        conversationId: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/AskSource" }

